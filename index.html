<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نموذج تقرير مدرسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: a fixed A4 sheet (794px) scaled to fit, with a sticky toolbar above it. */
:root{
  --ground:#e7eeec; --ink:#14262b; --muted:#5d6f72; --bar:#ffffffee; --barline:#cfdcd8;
  --teal:#0d3b47; --green:#3fa96a; --blue:#2a80c0; --mint:#eaf5ef; --line:#4ab577;
  --paper:#ffffff; --hint:#8a9a9c;
  --display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#0f1c1f;--ink:#e3eeec;--muted:#9fb3b4;--bar:#152629ee;--barline:#24403f;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0f1c1f;--ink:#e3eeec;--muted:#9fb3b4;--bar:#152629ee;--barline:#24403f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);direction:rtl}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--barline);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toolbar-in{max-width:794px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar h1{font-family:var(--display);font-size:17px;margin:0;font-weight:800}
.toolbar small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid transparent;display:inline-flex;gap:6px;align-items:center}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--teal);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--barline)}
.btn:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:progress}
.stage{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.fit{margin:0 auto;width:794px;transform-origin:top right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:10}

/* ---- The sheet: always a white printed page ---- */
.sheet{width:794px;min-height:1123px;background:var(--paper);color:#14262b;position:relative;box-shadow:0 2px 18px #0d3b4722;display:flex;flex-direction:column}

.banner .id{position:absolute;right:45.5%;top:23%;display:flex;flex-direction:column;gap:2px;text-align:right;color:#fff;font-family:var(--display);max-width:50%}
.banner .moe{font-weight:800;font-size:22px;line-height:1.3}
.banner .dir{font-weight:500;font-size:16px;line-height:1.35;color:#d6ece3}
.banner .sch{font-weight:700;font-size:18px;line-height:1.35;color:#7fd3a3}
.banner .school{position:absolute;left:26.5%;width:47%;top:74.5%;height:24%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:800;font-size:21px}
.content{padding:12px 52px 6px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{text-align:center;font-family:var(--display);font-weight:800;font-size:30px;color:var(--teal);margin:0}
.subtitle{text-align:center;font-size:17px;margin-top:4px}
.subtitle b{color:var(--teal)}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
td,th{border:1px solid var(--line);padding:6px 10px;vertical-align:middle;text-align:right}
th{background:var(--teal);color:#fff;font-family:var(--display);font-weight:700;width:118px;font-size:14px}
.sec{display:flex;flex-direction:column}
.sec-h{background:var(--teal);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;padding:5px 12px}
.sec .box{border:1px solid var(--line);border-top:0;padding:8px 12px;font-size:14px;line-height:1.7;min-height:80px}
.goals td.n{width:40px;text-align:center;background:var(--mint);color:var(--teal);font-weight:700}
.goals td{padding:4px 10px}
[contenteditable]{border-radius:3px;min-height:1.4em;transition:background .15s}
[contenteditable]:hover{background:#4ab5771a}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--hint)}
.ev{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-top:0}
.ev-cell{padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ev-cell + .ev-cell{border-right:1px solid var(--line)}
.ev-img{width:100%;height:120px;border:1.5px dashed #9cc4b4;border-radius:6px;background:#f5f8f7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#6f8c86;font-size:13px;cursor:pointer;overflow:hidden;position:relative}
.ev-img.has{border-style:solid;border-color:transparent;background:#fff}
.ev-img img{max-width:100%;max-height:100%;object-fit:contain}
.ev-img svg{width:38px;height:38px}
.ev-cap{font-size:12.5px;text-align:center;width:100%;color:#3b4d50}
.mini{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.mini button{font:inherit;font-size:11.5px;border:0;border-radius:5px;padding:3px 7px;background:#0d3b47cc;color:#fff;cursor:pointer}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-top:4px}
.sign .who{text-align:center;padding-top:8px}
.sign .role{font-family:var(--display);font-weight:700;color:var(--teal);font-size:16px}
.sign .name{font-size:15px;margin-top:4px}
.sig{display:flex;flex-direction:column;align-items:center;gap:4px}
.sig-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;color:var(--teal);font-size:16px}
.sig-h img{width:34px;height:34px}
.pad-wrap{position:relative;width:250px;height:78px}
canvas.pad{width:250px;height:78px;border-bottom:2px dotted var(--line);touch-action:none;cursor:crosshair;background:transparent;display:block}
.pad-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:12.5px;pointer-events:none}

<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>انقر لإدراج صورة</span>';
const KEY='school-report-form-v3';

/* scale the A4 sheet to the screen */
function fit(){const f=$('#fit');const avail=$('.stage').clientWidth-parseFloat(getComputedStyle($('.stage')).paddingLeft)*2;
  const s=Math.min(1,avail/794);f.style.transform=s<1?`scale(${s})`:'';f.style.height=s<1?($('#sheet').offsetHeight*s)+'px':'';f.style.marginRight=s<1?'0':'';}
addEventListener('resize',fit);

/* toast */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800)}

/* paste as plain text */
document.addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('[contenteditable]');if(!el)return;e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));});
document.querySelectorAll('[contenteditable]').forEach(el=>el.addEventListener('input',()=>{if(!el.textContent.trim())el.innerHTML='';save();}));

/* evidence images */
let target=null;
function fillSlot(slot,src){slot.classList.toggle('has',!!src);
  slot.innerHTML=src?`<img alt="شاهد" src="${src}"><div class="mini" data-html2canvas-ignore><button type="button" data-act="change">تغيير</button><button type="button" data-act="del">حذف</button></div>`:CAM;}
document.querySelectorAll('.ev-img').forEach(slot=>{
  if(!slot.classList.contains('has'))fillSlot(slot,null);else fillSlot(slot,slot.querySelector('img').src);
  const open=()=>{target=slot;$('#file').click()};
  slot.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.act==='del'){fillSlot(slot,null);save();return}open()});
  slot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
});
function downscale(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.85),im)};im.src=r.result};r.readAsDataURL(file)}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f||!target)return;
  if(target==='sig'){downscale(f,600,(url,im)=>{drawSigImage(url);save()});}
  else downscale(f,1200,url=>{fillSlot(target,url);save()});});

/* signature pad */
const pad=$('#pad'),ctx=pad.getContext('2d');let drawing=false,signed=false,last=null;
ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0d2a6b';
function pos(e){const r=pad.getBoundingClientRect();return{x:(e.clientX-r.left)*pad.width/r.width,y:(e.clientY-r.top)*pad.height/r.height}}
function setSigned(v){signed=v;$('#padHint').hidden=v}
pad.addEventListener('pointerdown',e=>{drawing=true;pad.setPointerCapture(e.pointerId);last=pos(e);setSigned(true)});
pad.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t,()=>{if(drawing){drawing=false;save()}}));
$('#sigClear').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);setSigned(false);save()};
$('#sigUpload').onclick=()=>{target='sig';$('#file').click()};
function drawSigImage(url){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,pad.width,pad.height);const k=Math.min(pad.width/im.width,pad.height/im.height);
  const w=im.width*k,h=im.height*k;ctx.drawImage(im,(pad.width-w)/2,(pad.height-h)/2,w,h);setSigned(true)};im.src=url}

/* draft kept in this browser */
function save(){try{const d={f:{},img:{},sig:signed?pad.toDataURL():null};
  document.querySelectorAll('[contenteditable][id]').forEach(el=>d.f[el.id]=el.innerText);
  document.querySelectorAll('.ev-img').forEach(s=>{const i=s.querySelector('img');d.img[s.dataset.slot]=i?i.src:null});
  localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
  for(const id in d.f){const el=document.getElementById(id);if(el)el.innerText=d.f[id]}
  for(const k in d.img){const s=document.querySelector(`.ev-img[data-slot="${k}"]`);if(s)fillSlot(s,d.img[k])}
  if(d.sig)drawSigImage(d.sig)}catch(e){}}
load();

/* blank form (in-page confirm: dialogs are not shown) */
let armed=null;
$('#btnReset').onclick=()=>{const b=$('#btnReset');
  if(!armed){b.lastChild.textContent='اضغط مرة أخرى للتأكيد';armed=setTimeout(()=>{armed=null;b.lastChild.textContent='نموذج فارغ'},3500);return}
  clearTimeout(armed);armed=null;b.lastChild.textContent='نموذج فارغ';
  document.querySelectorAll('[contenteditable][id]').forEach(el=>{if(!['f_moe','f_dir','f_school','f_title'].includes(el.id))el.innerHTML=''});
  document.querySelectorAll('.ev-img').forEach(s=>fillSlot(s,null));ctx.clearRect(0,0,pad.width,pad.height);setSigned(false);save();fit();toast('تم تفريغ النموذج');};

/* export: A4 PDF via the viewer's download prompt */
let dl=null;const dlReady=(window.claude&&window.claude.use)?window.claude.use('downloads').then(x=>dl=x).catch(()=>null):Promise.resolve(null);
async function buildPdf(){
  const sheet=$('#sheet'),f=$('#fit');const tr=f.style.transform;f.style.transform='';
  document.activeElement&&document.activeElement.blur();sheet.classList.add('exporting');
  try{await document.fonts.ready;
    const c=await html2canvas(sheet,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,windowWidth:900,
      ignoreElements:el=>el.hasAttribute&&el.hasAttribute('data-html2canvas-ignore')});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const W=210,H=c.height*W/c.width;pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,W,Math.min(H,297));
    return pdf.output('blob');
  }finally{sheet.classList.remove('exporting');f.style.transform=tr}}
function fname(){const t=($('#f_program').innerText||$('#f_title').innerText||'تقرير').trim().replace(/[\\/:*?"<>|]/g,'').slice(0,60);return t||'تقرير'}
async function exportPdf(btn,name,okMsg){
  if(!(window.claude&&window.claude.use)){btn.disabled=true;const o=btn.lastChild.textContent;btn.lastChild.textContent='جارٍ التجهيز...';
    try{const blob=await buildPdf();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('تم تنزيل الملف')}
    catch(e){toast('تعذّر تجهيز الملف، حاول مرة أخرى')}finally{btn.disabled=false;btn.lastChild.textContent=o}return}
  await dlReady; if(!dl){toast('التنزيل غير متاح في هذا العرض.');return}
  btn.disabled=true;const old=btn.lastChild.textContent;btn.lastChild.textContent='جارٍ التجهيز...';
  try{const blob=await buildPdf();await dl.save({filename:name,data:blob});toast(okMsg)}
  catch(e){const c=e&&e.code;if(c==='declined')toast('تم إلغاء التنزيل');else toast('تعذّر تجهيز الملف، حاول مرة أخرى')}
  finally{btn.disabled=false;btn.lastChild.textContent=old}}
$('#btnDl').onclick=e=>exportPdf(e.currentTarget,fname()+'.pdf','تم تنزيل الملف');
$('#btnPrint').onclick=e=>(!(window.claude&&window.claude.use))?printPage():exportPdf(e.currentTarget,fname()+' - للطباعة.pdf','تم تنزيل نسخة الطباعة. افتح الملف واختر طباعة');

function printPage(){const f=$('#fit');const tr=f.style.transform,hh=f.style.height;f.style.transform='';f.style.height='';document.activeElement&&document.activeElement.blur();
  document.documentElement.classList.add('printing');$('#sheet').classList.add('exporting');
  const done=()=>{document.documentElement.classList.remove('printing');$('#sheet').classList.remove('exporting');f.style.transform=tr;f.style.height=hh;fit();removeEventListener('afterprint',done)};
  addEventListener('afterprint',done);window.print();setTimeout(()=>{if(!matchMedia('print').matches)done()},1500)}
document.fonts&&document.fonts.ready.then(fit);fit();
</script>
</body>
